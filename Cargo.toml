[workspace]
resolver = "2"

members = [
    "saps", 
    "saps-cli",

    # examples
    "examples/basic-server",
    "examples/basic-workers",

    # macros
    "macros/db-pool-macro",
    "macros/db-tx",
    "macros/test-macro", 
    "macros/frontend", 
    "macros/background-task"
, "macros/db-embedded-pool-macro", "examples/embedded-db"]

[workspace.dependencies]
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "process", "macros", "time", "signal", "tracing"] }

# Web / Networking
http = "1.4.0"
http-ws  = { package = "http", version = "1" }
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
axum = { version = "0.8.8", features = ["ws"] }
axum-extra  = { version = "0.12.5", features = ["typed-header"] }
tower = { version = "0.5.3" }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
http-body-util = "0.1.3"
hyper = { version = "1.8.1", default-features = false, features = ["http1"] }
headers = "0.4"
tokio-tungstenite = "0.30.0"

# Auth / Security / Crypto
argon2 = "0.6.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.0"
base64 = "0.23.1"
rustls = { version = "0.23", features = ["ring"] }

# Observability
tracing = "0.1.44"

# DAL DB and storage
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres", 
    "json", 
    "runtime-tokio", 
    "tls-rustls-ring-webpki", 
    "migrate", 
    "chrono", 
    "uuid",
    "macros"
] }

# for proc macros
quote = "1.0.44"
syn = { version = "3.0.6", features = ["full"] }
proc-macro2 = "1.0.101"
paste = "1.0"
prettyplease = "0.3.0"

# Utility Crates
bytes = "1.11.1"
thiserror = "2.0.18"
anyhow = "1.0.102"
tempfile = "3.25.0"
uuid = { version = "1.21.0", features = ["serde", "v4", "fast-rng", "js"] }

# cli tools
clap = { version = "4.5.60", features = ["derive"] }
dotenvy = "0.15"

# Local Crates
saps-db-pool-macro = { path = "macros/db-pool-macro", version = "0.1.1" }
saps-db-embedded-pool-macro = { path = "macros/db-embedded-pool-macro", version = "0.1.0" }
saps-db-tx = { path = "macros/db-tx", version = "0.1.1" }
saps-test-macro = { path = "macros/test-macro", version = "0.1.2" }
saps-frontend-macro = { path = "macros/frontend", version = "0.1.1" }
saps-background-task = { path = "macros/background-task", version = "0.1.1" }
saps = { path = "saps" }

# Serialization & Data Types
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.149"
chrono = { version = "0.4.43", features = ["serde", "clock"], default-features = false }
rmp-serde = "1.3.1"
serde-wasm-bindgen = "0.6"

# frontend
include_dir = { version = "0.7.4" }
mime_guess = "2.0.5"
rust-embed = "8.11.0"

# background tasks
ctor = "1.0.6"
cron = "0.17.0"

# storage
postgresql_embedded = { version = "0.21.0", features = ["tokio"] }

# open API
aide = { version = "0.15.1", features = ["axum", "axum-json", "macros"] }

# files: collaborative (CRDT) text buffer used by the mem-file layer
yrs = "0.28.0"

# files: embedded key-value store backing the `files-kv` engine
redb = "4.1.0"

# files: browser (wasm) support. `web-sys` carries the IndexedDB surface the
# `files-indexed-db` engine drives; `WorkerGlobalScope` is needed because
# `window()` does not exist inside a web worker.
wasm-bindgen = "0.2.112"
wasm-bindgen-futures = "0.4.59"
wasm-bindgen-test = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "WorkerGlobalScope",
  "Event",
  "EventTarget",
  "DomException",
  "DomStringList",
  "IdbFactory",
  "IdbOpenDbRequest",
  "IdbDatabase",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbObjectStore",
  "IdbRequest",
  "IdbVersionChangeEvent",
] }

# files: test-only async driver for the blocking test harness
futures = "0.3.32"

# `getrandom 0.2` is reached transitively (via `wasm-bindgen-test` and `uuid`) and
# refuses to build for `wasm32-unknown-unknown` unless its `js` backend is on.
# Declared here so the feature unifies across the whole wasm build graph.
getrandom_wasm = { package = "getrandom", version = "0.2", features = ["js"] }
