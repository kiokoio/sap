[workspace]
resolver = "2"

members = [
    "saps", 
    "saps-cli",

    # examples
    "examples/basic-server",

    # macros
    "macros/db-pool-macro",
    "macros/db-tx",
    "macros/test-macro"
]

[workspace.dependencies]
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "process", "macros", "time", "signal", "tracing"] }

# Web / Networking
http = "1.4.0"
http-ws  = { package = "http", version = "1" }
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
axum = { version = "0.8.8", features = ["ws"] }
axum-extra  = { version = "0.12.5", features = ["typed-header"] }
tower = { version = "0.5.3" }
tower-http = { version = "0.6.8", features = ["trace", "cors"] }
http-body-util = "0.1.3"
hyper = { version = "1.8.1", default-features = false, features = ["http1"] }
headers = "0.4"
tokio-tungstenite = "0.29.0"

# Auth / Security / Crypto
argon2 = "0.5.3"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.0"
base64 = "0.22.1"
rustls = { version = "0.23", features = ["ring"] }

# Observability
tracing = "0.1.44"

# DAL DB and storage
sqlx = { version = "0.8.6", default-features = false, features = [
    "postgres", 
    "json", 
    "runtime-tokio", 
    "runtime-tokio-rustls", 
    "migrate", 
    "chrono", 
    "uuid",
    "macros"
] }

# for proc macros
quote = "1.0.44"
syn = { version = "2.0.106", features = ["full"] }
proc-macro2 = "1.0.101"
paste = "1.0"
prettyplease = "0.2"

# Utility Crates
bytes = "1.11.1"
thiserror = "2.0.18"
anyhow = "1.0.102"
tempfile = "3.25.0"
uuid = { version = "1.21.0", features = ["serde", "v4", "fast-rng", "js"] }

# cli tools
clap = { version = "4.5.60", features = ["derive"] }
dotenvy = "0.15"

# Local Crates
saps-db-pool-macro = { path = "macros/db-pool-macro" }
saps-db-tx = { path = "macros/db-tx" }
saps-test-macro = { path = "macros/test-macro" }
saps = { path = "saps" }

# Serialization & Data Types
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.149"
chrono = { version = "0.4.43", features = ["serde", "clock"], default-features = false }
rmp-serde = "1.3.1"
serde-wasm-bindgen = "0.6"
